server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SQLite WASM requires cross-origin isolation in addition to a secure origin.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Apply the default before Logseq initializes its workers.
    sub_filter '<head>' '<head><script src="/training-config.js"></script>';

    location = /training-config.js {
        expires -1;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
